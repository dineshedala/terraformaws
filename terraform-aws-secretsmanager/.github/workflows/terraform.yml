name: Terraform Apply for Secrets Manager

on:
  push:
    branches:
      - main
    paths:
      - 'terraform-aws-secretsmanager/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform-aws-secretsmanager/**'

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./terraform-aws-secretsmanager
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./terraform-aws-secretsmanager
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ./terraform-aws-secretsmanager
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform-aws-secretsmanager
        run: |
          terraform plan \
            -var="secret_value=${{ secrets.TEST_SECRET_VALUE }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ./terraform-aws-secretsmanager
        run: |
          terraform apply \
            -var="secret_value=${{ secrets.TEST_SECRET_VALUE }}" \
            -auto-approve tfplan

      - name: Capture Terraform Output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ./terraform-aws-secretsmanager
        run: |
          terraform output -raw secret_id > secret_id.txt
          echo "Secret ID: $(cat secret_id.txt)"
